on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        # Checkout pull request HEAD commit instead of merge commit
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      with:
        version: 0.13.9
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install Python deps
      run: |
        uv pip sync --system --require-hashes requirements-build.txt requirements-dev.txt
    - uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        # also add an aarch64 test, just one python version
        include:
          - os: ubuntu-24.04-arm
            python-version: "3.14"
      fail-fast: false

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      with:
        version: 0.13.9

    - name: Install dependencies
      run: |
        uv pip sync --system --require-hashes requirements-build.txt requirements-test.txt
        uv pip install --system --no-deps --no-build-isolation -e .

    - name: Test with pytest
      run: |
        pytest && pytest --only-ipython-magic
